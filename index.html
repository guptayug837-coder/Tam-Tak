<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Tam Tak - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =========================
         LOGIN PAGE
    ========================== -->

    <div class="login-page">

        <div class="login-container">

            <!-- LOGO -->

            <div class="logo-area">

                <h1>Tam Tak</h1>

                <p>
                    Connect with people.
                    Share your world.
                </p>

            </div>


            <!-- GOOGLE LOGIN -->

            <button
                type="button"
                id="googleLogin"
                class="social-btn google-btn"
            >

                <span class="icon">G</span>

                Continue with Google

            </button>


            <!-- FACEBOOK LOGIN -->

            <button
                type="button"
                id="facebookLogin"
                class="social-btn facebook-btn"
            >

                <span class="icon">f</span>

                Continue with Facebook

            </button>


            <!-- DIVIDER -->

            <div class="divider">

                <span></span>

                <p>OR</p>

                <span></span>

            </div>


            <!-- EMAIL -->

            <div class="input-group">

                <label for="email">
                    Email address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <div class="password-box">

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >

                    <button
                        type="button"
                        id="showPassword"
                    >
                        Show
                    </button>

                </div>

            </div>


            <!-- FORGOT LINKS -->

            <div class="forgot-links">

                <button
                    type="button"
                    id="forgotEmail"
                >
                    Forgot Email ID?
                </button>

                <button
                    type="button"
                    id="forgotPassword"
                >
                    Forgot Password?
                </button>

            </div>


            <!-- LOGIN -->

            <button
                type="button"
                id="loginBtn"
                class="login-btn"
            >
                Log In
            </button>


            <!-- CREATE ACCOUNT -->

            <button
                type="button"
                id="createAccountBtn"
                class="create-account-btn"
            >
                Create New Account
            </button>


            <!-- MESSAGE -->

            <p
                id="authMessage"
                class="auth-message"
            ></p>


            <!-- TERMS -->

            <p class="terms">

                By continuing, you agree to
                Tam Tak's Terms and Privacy Policy.

            </p>

        </div>

    </div>
    
<script type="module" src="script.js"></script>    
    

</body>
</html>
