<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tam Tak - Login</title>

    <link rel="stylesheet" href="./style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-card">

            <div class="logo">
                <h1>Tam Tak</h1>
                <p>Connect. Share. Discover.</p>
            </div>

            <button
                id="googleLogin"
                class="social-button"
                type="button">
                <span>G</span>
                Continue with Google
            </button>

            <button
                id="facebookLogin"
                class="social-button"
                type="button">
                <span>f</span>
                Continue with Facebook
            </button>

            <div class="divider">
                <span></span>
                <b>OR</b>
                <span></span>
            </div>

            <label for="email">
                Email address
            </label>

            <input
                id="email"
                type="email"
                placeholder="Enter your email">

            <label for="password">
                Password
            </label>

            <div class="password-wrapper">

                <input
                    id="password"
                    type="password"
                    placeholder="Enter your password">

                <button
                    id="showPassword"
                    type="button">
                    Show
                </button>

            </div>

            <div class="forgot-row">

                <button
                    id="forgotEmail"
                    type="button">
                    Forgot Email?
                </button>

                <button
                    id="forgotPassword"
                    type="button">
                    Forgot Password?
                </button>

            </div>

            <button
                id="loginBtn"
                class="login-button"
                type="button">
                Log In
            </button>

            <button
                id="createAccountBtn"
                class="create-button"
                type="button">
                Create New Account
            </button>

            <p
                id="authMessage"
                class="auth-message">
            </p>

            <p class="terms">
                By continuing, you agree to
                Tam Tak's Terms and Privacy Policy.
            </p>

        </div>

    </main>

    <!-- ONLY ONE SCRIPT -->

<script type="module" src="./script.js"></script></body>

</html>
