<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tam Tak - Home</title>
    <link rel="stylesheet" href="./home.css">
</head>
<body>

<header class="top-header">
    <div class="brand">Tam Tak</div>
    <div class="header-icons">
        <button id="searchBtn" class="icon-btn">🔍</button>
        <button id="notificationBtn" class="icon-btn">♡</button>
        <button id="createPostBtn" class="icon-btn">＋</button>
    </div>
</header>

<main class="main-container">

    <section class="stories-section">
        <div class="stories">
            <div class="story-item">
                <div class="story-image your-story">＋</div>
                <span>Your Story</span>
            </div>
            <div class="story-item">
                <div class="story-image">Y</div>
                <span>Yug</span>
            </div>
            <div class="story-item">
                <div class="story-image">A</div>
                <span>Arjun</span>
            </div>
            <div class="story-item">
                <div class="story-image">R</div>
                <span>Riya</span>
            </div>
            <div class="story-item">
                <div class="story-image">S</div>
                <span>Sam</span>
            </div>
            <div class="story-item">
                <div class="story-image">K</div>
                <span>Karan</span>
            </div>
        </div>
    </section>

    <section class="feed" id="feed">
        <p id="feedStatus" style="padding:20px;text-align:center;">
            Loading posts...
        </p>
    </section>

    <aside class="right-sidebar">
        <div class="profile-card">
            <div class="profile-left">
                <div class="profile-avatar">Y</div>
                <div>
                    <strong>Yug Gupta</strong>
                    <small>@yug</small>
                </div>
            </div>
            <button class="switch-btn">Switch</button>
        </div>

        <div class="suggest-header">
            <span>Suggested for you</span>
            <button>See All</button>
        </div>

        <div class="suggestion">
            <div class="suggest-user">
                <div class="suggest-avatar">A</div>
                <div><strong>Arjun</strong><small>New to Tam Tak</small></div>
            </div>
            <button>Follow</button>
        </div>

        <div class="suggestion">
            <div class="suggest-user">
                <div class="suggest-avatar">R</div>
                <div><strong>Riya</strong><small>Suggested</small></div>
            </div>
            <button>Follow</button>
        </div>

        <div class="suggestion">
            <div class="suggest-user">
                <div class="suggest-avatar">K</div>
                <div><strong>Karan</strong><small>Popular creator</small></div>
            </div>
            <button>Follow</button>
        </div>
    </aside>
</main>

<nav class="bottom-nav">
    <button class="nav-btn active" id="homeBtn">🏠<span>Home</span></button>
    <button class="nav-btn" id="bottomSearch">🔍<span>Search</span></button>
    <button class="nav-btn" id="bottomCreate">＋<span>Create</span></button>
    <button class="nav-btn" id="reelsBtn">▶<span>Reels</span></button>
    <button class="nav-btn" id="profileBtn">👤<span>Profile</span></button>
</nav>

<div class="modal" id="postModal">
    <div class="modal-box">
        <div class="modal-header">
            <h2>Create Post</h2>
            <button id="closeModal">✕</button>
        </div>

        <textarea id="postText" placeholder="What's on your mind?"></textarea>

        <button id="publishBtn" class="publish-btn">
            Publish Post
        </button>
    </div>
</div>

<script type="module" src="./home.js"></script>

</body>
</html>
