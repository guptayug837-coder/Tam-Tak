<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tam Tak - Home</title>

    <link rel="stylesheet" href="style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >
</head>

<body>

<!-- ================= TOP HEADER ================= -->

<header class="top-header">

    <div class="logo">
        Tam Tak
    </div>

    <div class="header-icons">
        <button id="createPostBtn">
            <i class="fa-solid fa-plus"></i>
        </button>

        <button id="notificationBtn">
            <i class="fa-regular fa-heart"></i>
        </button>
    </div>

</header>


<!-- ================= MAIN ================= -->

<main class="main-container">

    <!-- ================= STORIES ================= -->

    <section class="stories-section">

        <div class="stories">

            <!-- Your Story -->
            <div class="story-item">

                <div class="story-image your-story">
                    <img
                        src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200"
                        alt="Your Story"
                    >

                    <span class="story-plus">+</span>
                </div>

                <p>Your story</p>

            </div>


            <!-- Story 1 -->
            <div class="story-item">

                <div class="story-image">
                    <img
                        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=200"
                        alt="Story"
                    >
                </div>

                <p>thevishal</p>

            </div>


            <!-- Story 2 -->
            <div class="story-item">

                <div class="story-image">
                    <img
                        src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=200"
                        alt="Story"
                    >
                </div>

                <p>gupta.yg</p>

            </div>


            <!-- Story 3 -->
            <div class="story-item">

                <div class="story-image">
                    <img
                        src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=200"
                        alt="Story"
                    >
                </div>

                <p>sadhna</p>

            </div>


            <!-- Story 4 -->
            <div class="story-item">

                <div class="story-image">
                    <img
                        src="https://images.unsplash.com/photo-1544005313-94ddf0286df2?w=200"
                        alt="Story"
                    >
                </div>

                <p>priya</p>

            </div>


            <!-- Story 5 -->
            <div class="story-item">

                <div class="story-image">
                    <img
                        src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200"
                        alt="Story"
                    >
                </div>

                <p>neha</p>

            </div>

        </div>

    </section>


    <!-- ================= FEED ================= -->

    <section id="feed">


        <!-- ================= POST 1 ================= -->

        <article class="post">

            <!-- Post Header -->

            <div class="post-header">

                <div class="user-info">

                    <img
                        src="https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=100"
                        alt="Profile"
                    >

                    <div>
                        <h3>sonii.thakur</h3>

                        <span>
                            <i class="fa-solid fa-music"></i>
                            Tam Tak Music
                        </span>
                    </div>

                </div>


                <button class="follow-btn">
                    Follow
                </button>

                <button class="more-btn">
                    <i class="fa-solid fa-ellipsis"></i>
                </button>

            </div>


            <!-- Post Image -->

            <div class="post-media">

                <img
                    src="https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=900"
                    alt="Tam Tak Post"
                >

                <button class="video-play">
                    <i class="fa-solid fa-play"></i>
                </button>

            </div>


            <!-- Post Actions -->

            <div class="post-actions">

                <div class="left-actions">

                    <button class="like-btn">
                        <i class="fa-regular fa-heart"></i>
                    </button>

                    <button class="comment-btn">
                        <i class="fa-regular fa-comment"></i>
                    </button>

                    <button class="share-btn">
                        <i class="fa-regular fa-paper-plane"></i>
                    </button>

                </div>

                <button class="save-btn">
                    <i class="fa-regular fa-bookmark"></i>
                </button>

            </div>


            <!-- Likes -->

            <div class="post-content">

                <strong class="likes">
                    1,245 likes
                </strong>

                <p>
                    <strong>sonii.thakur</strong>
                    Welcome to Tam Tak ❤️
                </p>

                <button class="view-comments">
                    View all 84 comments
                </button>

                <small>
                    2 HOURS AGO
                </small>

            </div>

        </article>



        <!-- ================= POST 2 ================= -->

        <article class="post">

            <div class="post-header">

                <div class="user-info">

                    <img
                        src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100"
                        alt="Profile"
                    >

                    <div>

                        <h3>priya_yg</h3>

                        <span>
                            Original audio
                        </span>

                    </div>

                </div>

                <button class="follow-btn">
                    Follow
                </button>

                <button class="more-btn">
                    <i class="fa-solid fa-ellipsis"></i>
                </button>

            </div>


            <div class="post-media">

                <img
                    src="https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=900"
                    alt="Tam Tak Post"
                >

            </div>


            <div class="post-actions">

                <div class="left-actions">

                    <button class="like-btn">
                        <i class="fa-regular fa-heart"></i>
                    </button>

                    <button class="comment-btn">
                        <i class="fa-regular fa-comment"></i>
                    </button>

                    <button class="share-btn">
                        <i class="fa-regular fa-paper-plane"></i>
                    </button>

                </div>

                <button class="save-btn">
                    <i class="fa-regular fa-bookmark"></i>
                </button>

            </div>


            <div class="post-content">

                <strong class="likes">
                    892 likes
                </strong>

                <p>
                    <strong>priya_yg</strong>
                    Life is better with good vibes ✨
                </p>

                <button class="view-comments">
                    View all 31 comments
                </button>

                <small>
                    5 HOURS AGO
                </small>

            </div>

        </article>


    </section>

</main>



<!-- ================= BOTTOM NAVIGATION ================= -->

<nav class="bottom-nav">

    <button class="nav-btn active" data-page="home">
        <i class="fa-solid fa-house"></i>
        <span>Home</span>
    </button>


    <button class="nav-btn" id="reelsBtn">
        <i class="fa-solid fa-clapperboard"></i>
        <span>Reels</span>
    </button>


    <button class="nav-btn create-btn" id="bottomCreateBtn">
        <i class="fa-solid fa-plus"></i>
    </button>


    <button class="nav-btn" id="searchBtn">
        <i class="fa-solid fa-magnifying-glass"></i>
        <span>Search</span>
    </button>


    <button class="nav-btn" id="profileBtn">
        <img
            src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100"
            alt="Profile"
        >

        <span>Profile</span>

    </button>

</nav>



<!-- ================= CREATE POST MODAL ================= -->

<div class="modal" id="postModal">

    <div class="modal-box">

        <button class="close-modal" id="closeModal">
            ×
        </button>

        <h2>Create Post</h2>

        <div class="upload-box">

            <i class="fa-regular fa-image"></i>

            <p>
                Create a new post on Tam Tak
            </p>

            <input
                type="file"
                id="postImage"
                accept="image/*"
            >

        </div>

        <button class="publish-btn" id="publishBtn">
            Publish
        </button>

    </div>

</div>



<script src="script.js"></script>

</body>
</html>
