<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tam Tak - Home</title>

    <link rel="stylesheet" href="./style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #111827;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 100;
            height: 64px;
            background: white;
            border-bottom: 1px solid #ddd;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #833ab4;
        }

        .logout-btn {
            border: none;
            background: #111827;
            color: white;
            padding: 9px 15px;
            border-radius: 8px;
            cursor: pointer;
        }

        .container {
            width: min(700px, 94%);
            margin: 20px auto 100px;
        }

        .user-card,
        .create-card,
        .post-card {
            background: white;
            border-radius: 15px;
            padding: 16px;
            margin-bottom: 18px;
            box-shadow: 0 3px 14px rgba(0,0,0,.08);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg,#833ab4,#fd1d1d,#fcb045);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 20px;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .name {
            font-weight: 700;
        }

        .email {
            font-size: 13px;
            color: #777;
        }

        .create-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        #caption {
            width: 100%;
            min-height: 90px;
            resize: vertical;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            outline: none;
            font-size: 15px;
            margin-bottom: 12px;
        }

        .file-box {
            border: 2px dashed #bbb;
            border-radius: 12px;
            padding: 18px;
            text-align: center;
            margin-bottom: 12px;
            background: #fafafa;
        }

        #mediaFile {
            width: 100%;
        }

        #preview {
            margin-top: 12px;
        }

        #preview img,
        #preview video {
            width: 100%;
            max-height: 450px;
            object-fit: contain;
            border-radius: 12px;
        }

        .post-btn {
            width: 100%;
            border: none;
            background: linear-gradient(90deg,#833ab4,#fd1d1d,#fcb045);
            color: white;
            padding: 13px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .post-btn:disabled {
            opacity: .6;
            cursor: not-allowed;
        }

        .progress {
            margin-top: 10px;
            font-size: 14px;
            color: #555;
            text-align: center;
        }

        .post-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .post-date {
            font-size: 12px;
            color: #888;
        }

        .caption {
            margin: 8px 0 12px;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .post-media {
            width: 100%;
            max-height: 600px;
            object-fit: contain;
            background: #000;
            border-radius: 12px;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .action-btn {
            border: none;
            background: #f1f3f5;
            padding: 9px 14px;
            border-radius: 8px;
            cursor: pointer;
        }

        .feed-title {
            font-size: 22px;
            font-weight: 700;
            margin: 25px 0 14px;
        }

        .loading,
        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 62px;
            background: white;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .bottom-nav button {
            border: none;
            background: none;
            font-size: 14px;
            cursor: pointer;
        }

        .message {
            text-align: center;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header class="topbar">
    <div class="logo">Tam Tak</div>

    <button id="logoutBtn" class="logout-btn">
        Logout
    </button>
</header>


<main class="container">

    <!-- CURRENT USER -->
    <section class="user-card">
        <div class="user-info">

            <div class="avatar" id="userAvatar">
                U
            </div>

            <div>
                <div class="name" id="userName">
                    Loading...
                </div>

                <div class="email" id="userEmail">
                    Loading...
                </div>
            </div>

        </div>
    </section>


    <!-- CREATE POST -->
    <section class="create-card">

        <div class="create-title">
            Create a Post
        </div>

        <textarea
            id="caption"
            placeholder="What's on your mind?"
        ></textarea>

        <div class="file-box">

            <input
                type="file"
                id="mediaFile"
                accept="image/*,video/*"
            >

            <div style="font-size:13px;color:#777;margin-top:8px;">
                Select a photo or video
            </div>

        </div>


        <div id="preview"></div>


        <button
            id="postBtn"
            class="post-btn"
            type="button"
        >
            Post
        </button>


        <div
            id="progress"
            class="progress"
        ></div>

        <div
            id="message"
            class="message"
        ></div>

    </section>


    <div class="feed-title">
        Latest Posts
    </div>

    <section id="feed">

        <div class="loading">
            Loading posts...
        </div>

    </section>

</main>


<!-- BOTTOM NAV -->
<nav class="bottom-nav">

    <button onclick="location.href='./home.html'">
        🏠 Home
    </button>

    <button onclick="location.href='./home.html#feed'">
        🎬 Reels
    </button>

    <button onclick="location.href='./messages.html'">
        💬 Messages
    </button>

    <button onclick="scrollToTop()">
        👤 Profile
    </button>

</nav>


<script type="module">

import {
    onAuthStateChanged,
    signOut
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

import {
    collection,
    addDoc,
    query,
    orderBy,
    limit,
    getDocs,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

import {
    ref,
    uploadBytesResumable,
    getDownloadURL
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-storage.js";

import {
    auth,
    db,
    storage
} from "./firebase-config.js";


/* =========================
   ELEMENTS
========================= */

const userName = document.getElementById("userName");
const userEmail = document.getElementById("userEmail");
const userAvatar = document.getElementById("userAvatar");

const mediaFile = document.getElementById("mediaFile");
const caption = document.getElementById("caption");
const preview = document.getElementById("preview");

const postBtn = document.getElementById("postBtn");
const progress = document.getElementById("progress");
const message = document.getElementById("message");
const feed = document.getElementById("feed");

const logoutBtn = document.getElementById("logoutBtn");


let currentUser = null;


/* =========================
   AUTH CHECK
========================= */

onAuthStateChanged(auth, async (user) => {

    if (!user) {

        window.location.href = "./index.html";
        return;

    }

    currentUser = user;

    const name =
        user.displayName ||
        user.email?.split("@")[0] ||
        "User";

    userName.textContent = name;

    userEmail.textContent =
        user.email || "";

    const firstLetter =
        name.charAt(0).toUpperCase();

    userAvatar.textContent = firstLetter;

    if (user.photoURL) {

        userAvatar.innerHTML =
            `<img src="${user.photoURL}" alt="Profile">`;

    }

    await loadPosts();

});


/* =========================
   IMAGE / VIDEO PREVIEW
========================= */

mediaFile.addEventListener("change", () => {

    preview.innerHTML = "";

    const file = mediaFile.files[0];

    if (!file) return;


    if (file.size > 100 * 1024 * 1024) {

        message.textContent =
            "Video/photo must be under 100 MB.";

        mediaFile.value = "";

        return;

    }


    const url = URL.createObjectURL(file);


    if (file.type.startsWith("image/")) {

        const img =
            document.createElement("img");

        img.src = url;

        preview.appendChild(img);

    }


    else if (file.type.startsWith("video/")) {

        const video =
            document.createElement("video");

        video.src = url;

        video.controls = true;

        preview.appendChild(video);

    }

});


/* =========================
   CREATE POST
========================= */

postBtn.addEventListener("click", async () => {

    if (!currentUser) {

        message.textContent =
            "Please login first.";

        return;

    }


    const file =
        mediaFile.files[0];

    const text =
        caption.value.trim();


    if (!file && !text) {

        message.textContent =
            "Please add a photo, video or caption.";

        return;

    }


    if (file &&
        !file.type.startsWith("image/") &&
        !file.type.startsWith("video/")) {

        message.textContent =
            "Only photo and video files are allowed.";

        return;

    }


    if (file &&
        file.size > 100 * 1024 * 1024) {

        message.textContent =
            "File must be under 100 MB.";

        return;

    }


    postBtn.disabled = true;

    message.textContent = "";

    progress.textContent =
        "Preparing post...";


    try {

        let mediaUrl = "";
        let mediaType = "";
        let storagePath = "";


        /* =========================
           UPLOAD MEDIA
        ========================= */

        if (file) {

            mediaType =
                file.type.startsWith("video/")
                    ? "video"
                    : "image";


            const safeName =
                file.name
                    .replace(/[^a-zA-Z0-9._-]/g, "_");


            const fileName =
                Date.now() +
                "_" +
                safeName;


            storagePath =
                `posts/${currentUser.uid}/${fileName}`;


            const storageRef =
                ref(storage, storagePath);


            const uploadTask =
                uploadBytesResumable(
                    storageRef,
                    file
                );


            await new Promise(
                (resolve, reject) => {

                    uploadTask.on(
                        "state_changed",

                        (snapshot) => {

                            const percent =
                                Math.round(
                                    (
                                        snapshot.bytesTransferred /
                                        snapshot.totalBytes
                                    ) * 100
                                );

                            progress.textContent =
                                `Uploading ${percent}%`;

                        },

                        (error) => {

                            reject(error);

                        },

                        async () => {

                            mediaUrl =
                                await getDownloadURL(
                                    uploadTask.snapshot.ref
                                );

                            resolve();

                        }
                    );

                }
            );

        }


        progress.textContent =
            "Saving post...";


        /* =========================
           SAVE POST IN FIRESTORE
        ========================= */

        const name =
            currentUser.displayName ||
            currentUser.email?.split("@")[0] ||
            "User";


        await addDoc(
            collection(db, "posts"),
            {

                uid: currentUser.uid,

                name: name,

                email:
                    currentUser.email || "",

                caption: text,

                mediaUrl: mediaUrl,

                mediaType: mediaType,

                storagePath: storagePath,

                createdAt:
                    serverTimestamp()

            }
        );


        /* =========================
           RESET
        ========================= */

        caption.value = "";

        mediaFile.value = "";

        preview.innerHTML = "";

        progress.textContent = "";

        message.textContent =
            "Post uploaded successfully! 🎉";


        await loadPosts();


    }

    catch (error) {

        console.error(error);

        console.error(
            "Firebase error code:",
            error.code
        );

        console.error(
            "Firebase error message:",
            error.message
        );


        progress.textContent = "";


        message.textContent =
            "Post upload failed: " +
            error.message;

    }


    finally {

        postBtn.disabled = false;

    }

});


/* =========================
   LOAD POSTS
========================= */

async function loadPosts() {

    feed.innerHTML =
        `<div class="loading">
            Loading posts...
        </div>`;


    try {

        const postsQuery =
            query(
                collection(db, "posts"),
                orderBy(
                    "createdAt",
                    "desc"
                ),
                limit(100)
            );


        const snapshot =
            await getDocs(postsQuery);


        feed.innerHTML = "";


        if (snapshot.empty) {

            feed.innerHTML =
                `<div class="empty">
                    No posts yet.<br>
                    Create the first post!
                </div>`;

            return;

        }


        snapshot.forEach((doc) => {

            const post =
                doc.data();

            renderPost(post);

        });

    }

    catch (error) {

        console.error(error);

        feed.innerHTML =
            `<div class="empty">
                Unable to load posts.<br><br>
                ${escapeHTML(error.message)}
            </div>`;

    }

}


/* =========================
   RENDER POST
========================= */

function renderPost(post) {

    const card =
        document.createElement("article");

    card.className =
        "post-card";


    const name =
        post.name ||
        post.email?.split("@")[0] ||
        "User";


    const firstLetter =
        name.charAt(0).toUpperCase();


    const header =
        document.createElement("div");

    header.className =
        "post-header";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        firstLetter;


    const userBox =
        document.createElement("div");


    const nameElement =
        document.createElement("div");

    nameElement.className =
        "name";

    nameElement.textContent =
        name;


    const emailElement =
        document.createElement("div");

    emailElement.className =
        "email";

    emailElement.textContent =
        post.email || "";


    userBox.appendChild(
        nameElement
    );

    userBox.appendChild(
        emailElement
    );


    header.appendChild(
        avatar
    );

    header.appendChild(
        userBox
    );


    card.appendChild(
        header
    );


    /* CAPTION */

    if (post.caption) {

        const captionElement =
            document.createElement("div");

        captionElement.className =
            "caption";

        captionElement.textContent =
            post.caption;

        card.appendChild(
            captionElement
        );

    }


    /* MEDIA */

    if (post.mediaUrl) {

        if (post.mediaType === "video") {

            const video =
                document.createElement("video");

            video.className =
                "post-media";

            video.src =
                post.mediaUrl;

            video.controls = true;

            video.preload = "metadata";

            card.appendChild(
                video
            );

        }

        else {

            const img =
                document.createElement("img");

            img.className =
                "post-media";

            img.src =
                post.mediaUrl;

            img.alt =
                "Tam Tak post";

            img.loading =
                "lazy";

            card.appendChild(
                img
            );

        }

    }


    /* ACTIONS */

    const actions =
        document.createElement("div");

    actions.className =
        "actions";


    const like =
        document.createElement("button");

    like.className =
        "action-btn";

    like.textContent =
        "❤️ Like";

    like.onclick = () => {

        like.textContent =
            "❤️ Liked";

    };


    const comment =
        document.createElement("button");

    comment.className =
        "action-btn";

    comment.textContent =
        "💬 Comment";

    comment.onclick = () => {

        alert(
            "Comments feature will be connected next."
        );

    };


    const share =
        document.createElement("button");

    share.className =
        "action-btn";

    share.textContent =
        "↗️ Share";

    share.onclick = async () => {

        try {

            await navigator.clipboard.writeText(
                post.mediaUrl || ""
            );

            alert(
                "Post link copied!"
            );

        }

        catch {

            alert(
                "Share link: " +
                (post.mediaUrl || "")
            );

        }

    };


    actions.appendChild(
        like
    );

    actions.appendChild(
        comment
    );

    actions.appendChild(
        share
    );


    card.appendChild(
        actions
    );


    feed.appendChild(
        card
    );

}


/* =========================
   LOGOUT
========================= */

logoutBtn.addEventListener(
    "click",
    async () => {

        try {

            await signOut(auth);

            window.location.href =
                "./index.html";

        }

        catch (error) {

            alert(
                "Logout failed: " +
                error.message
            );

        }

    }
);


/* =========================
   HELPERS
========================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

}


window.scrollToTop = function () {

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

};

</script>

</body>
</html>
